# Prometheus 글로벌 설정
global:
  # 메트릭 수집 간격 (기본값)
  scrape_interval: 15s
  # 규칙 평가 간격
  evaluation_interval: 15s
  # 외부 레이블 (선택사항)
  external_labels:
    monitor: 'platform-monitor'
    environment: 'development'

# 알림 규칙 파일 경로 (선택사항)
rule_files:
# - "alert_rules.yml"
# - "recording_rules.yml"

# 알림 매니저 설정 (선택사항)
# alerting:
#  alertmanagers:
#    - static_configs:
#        - targets:
#          - alertmanager:9093

# 메트릭 수집 설정
scrape_configs:
  # Prometheus 자체 모니터링
  - job_name: 'prometheus'
    static_configs:
      - targets: [ 'localhost:9090' ]
    scrape_interval: 5s
    metrics_path: /metrics

  # Node Exporter - 시스템 메트릭 (CPU, 메모리, 디스크 등)
  - job_name: 'node-exporter'
    static_configs:
      - targets: [ 'platform-node-exporter:9100' ]
    scrape_interval: 10s

  # MySQL Exporter - 데이터베이스 메트릭
  - job_name: 'mysql-exporter'
    static_configs:
      - targets: [ 'platform-mysqld-exporter:9104' ]
    scrape_interval: 30s

  # 애플리케이션 메트릭 (Spring Boot Actuator )
  - job_name: 'spring-boot-app'
    static_configs:
      - targets: [ 'host.docker.internal:8080' ]
    metrics_path: '/public/platform/actuator/prometheus'
    scrape_interval: 15s